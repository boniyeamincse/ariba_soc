# Local development overrides
# This file is automatically loaded by Docker Compose and overrides docker-compose.yml
# Usage: docker compose up (automatically picks this file)

services:
  web:
    build:
      context: ../ariba_soc
      dockerfile: Dockerfile
    volumes:
      - ../ariba_soc:/app  # Live reload for development
    environment:
      - DJANGO_DEBUG=True
      - SKIP_COLLECTSTATIC=1

  scheduler:
    volumes:
      - ../ariba_soc:/app  # Live reload for development

  nginx:
    ports:
      - "8080:80"

  wazuh.manager:
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"

  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"

  wazuh.dashboard:
    ports:
      - "8443:5601"

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
