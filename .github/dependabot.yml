version: 2
updates:
  - package-ecosystem: pip
    directory: /ariba_soc
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
