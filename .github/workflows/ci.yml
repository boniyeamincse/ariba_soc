name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install flake8 black isort

      - name: Black format check
        run: black --check ariba_soc/

      - name: isort import check
        run: isort --check-only ariba_soc/

      - name: Flake8 lint
        run: flake8 ariba_soc/ --max-line-length=120 --ignore=E501,W503,E502

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ariba_soc_test
          POSTGRES_USER: ariba_soc
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r ariba_soc/requirements.txt
          pip install pytest pytest-django

      - name: Run migrations
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: ariba_soc_test
          DATABASE_USER: ariba_soc
          DATABASE_PASSWORD: testpass
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_CRYPTOGRAPHY_KEY: test-crypto-key
          DJANGO_DEBUG: "True"
        run: cd ariba_soc && python manage.py migrate --noinput

      - name: Run tests
        env:
          DATABASE_ENGINE: django.db.backends.postgresql
          DATABASE_NAME: ariba_soc_test
          DATABASE_USER: ariba_soc
          DATABASE_PASSWORD: testpass
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_CRYPTOGRAPHY_KEY: test-crypto-key
          DJANGO_DEBUG: "True"
        run: cd ariba_soc && python manage.py test --verbosity=2

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: docker build -t ariba-soc-web ./ariba_soc

      - name: Build infrastructure check
        run: docker compose -f infrastructure/docker-compose.yml config
