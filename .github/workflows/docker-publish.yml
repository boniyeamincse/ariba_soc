name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        # Only log in if not a PR from a fork
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web Image
        uses: docker/build-push-action@v4
        with:
          context: ./ariba_soc
          file: ./ariba_soc/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ariba_soc-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ariba_soc-web:${{ github.sha }}

      - name: Build and push Scheduler Image
        uses: docker/build-push-action@v4
        with:
          context: ./ariba_soc
          file: ./ariba_soc/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ariba_soc-scheduler:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ariba_soc-scheduler:${{ github.sha }}
