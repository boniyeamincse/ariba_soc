server {
    listen 443 ssl;
    server_name soc.example.com;

    ssl_certificate /etc/ssl/certs/soc.example.com.pem;
    ssl_certificate_key /etc/ssl/private/soc.example.com.key;

    location /static/ {
        alias /var/www/ariba-soc/staticfiles/;
        expires 30d;
    }

    # Confidential generated reports must never be served directly.
    # Downloads go through the authenticated Django view
    # (/reports/download/<id>/ with can_view_reports permission).
    location /media/reports/ {
        deny all;
        return 403;
    }

    location /media/ {
        alias /var/www/ariba-soc/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
