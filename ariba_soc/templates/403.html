{% extends 'base.html' %}
{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="ariba-card p-5">
                <i class="bi bi-shield-x text-danger" style="font-size: 4rem;"></i>
                <h2 class="mt-3 text-danger">Access Denied</h2>
                <p class="text-secondary mt-3">
                    You do not have permission to access this page.
                </p>
                {% if exception %}
                <p class="text-muted small">{{ exception }}</p>
                {% endif %}
                <a href="{% url 'alerts:table' %}" class="btn btn-ariba-primary mt-3">
                    <i class="bi bi-arrow-left"></i> Back to Alerts
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
