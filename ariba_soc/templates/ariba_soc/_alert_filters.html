<div class="filter-section">
    <form method="get" class="row g-2 align-items-end">
        <div class="col-12 col-md-2">
            <label class="text-secondary small mb-1">Search</label>
            <input type="text" name="search" class="form-control form-control-sm" placeholder="Search..." value="{{ current_filters.search|default:'' }}">
        </div>
        <div class="col-6 col-md-1">
            <label class="text-secondary small mb-1">Severity</label>
            <select name="severity" class="form-select form-select-sm filter-auto-submit">
                <option value="">All</option>
                {% for s in severities %}
                <option value="{{ s.name }}" {% if current_filters.severity == s.name %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-1">
            <label class="text-secondary small mb-1">Status</label>
            <select name="status" class="form-select form-select-sm filter-auto-submit">
                <option value="">All</option>
                {% for s in statuses %}
                <option value="{{ s.name }}" {% if current_filters.status == s.name %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-1">
            <label class="text-secondary small mb-1">Verdict</label>
            <select name="verdict" class="form-select form-select-sm filter-auto-submit">
                <option value="">All</option>
                {% for v in verdicts %}
                <option value="{{ v.name }}" {% if current_filters.verdict == v.name %}selected{% endif %}>{{ v.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-1">
            <label class="text-secondary small mb-1">Tag</label>
            <input type="text" name="tag" class="form-control form-control-sm" placeholder="tag" value="{{ current_filters.tag|default:'' }}">
        </div>
        <div class="col-6 col-md-2">
            <label class="text-secondary small mb-1">SOC Team</label>
            <select name="team" class="form-select form-select-sm filter-auto-submit">
                <option value="">All Teams</option>
                {% if user_soc_team %}
                <option value="my_team" {% if current_filters.team == 'my_team' %}selected{% endif %}>★ My Team ({{ user_soc_team.name|truncatechars:18 }})</option>
                {% endif %}
                {% for t in soc_teams %}
                <option value="{{ t.id }}" {% if current_filters.team == t.id|stringformat:"s" %}selected{% endif %}>
                    {{ t.name }} ({{ t.get_tier_display }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="text-secondary small mb-1">From</label>
            <input type="datetime-local" name="date_from" class="form-control form-control-sm" value="{{ current_filters.date_from|default:'' }}">
        </div>
        <div class="col-6 col-md-2">
            <label class="text-secondary small mb-1">To</label>
            <input type="datetime-local" name="date_to" class="form-control form-control-sm" value="{{ current_filters.date_to|default:'' }}">
        </div>
        <div class="col-6 col-md-1">
            <div class="form-check">
                <input class="form-check-input filter-auto-submit" type="checkbox" name="bookmarked" value="1" id="fBookmarked" {% if current_filters.bookmarked == '1' %}checked{% endif %}>
                <label class="form-check-label small" for="fBookmarked">★ Saved</label>
            </div>
        </div>
        <div class="col-12 col-md-1 d-flex gap-1">
            <button type="submit" class="btn btn-ariba-primary btn-sm flex-grow-1" title="Apply Filter"><i class="bi bi-search"></i></button>
            <a href="{% url 'alerts:table' %}" class="btn btn-ariba-outline btn-sm" title="Clear Filters"><i class="bi bi-x-lg"></i></a>
        </div>
    </form>

    <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
        <div class="dropdown">
            <button class="btn btn-sm btn-ariba-outline dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-bookmark-star"></i> Saved Filters
            </button>
            <ul class="dropdown-menu">
                {% for sf in saved_filters %}
                <li class="d-flex align-items-center">
                    <a class="dropdown-item" href="{% url 'alerts:table' %}{% if sf.query %}?{{ sf.query }}{% endif %}">
                        {{ sf.name }}{% if sf.is_shared %} <span class="badge bg-info text-dark">shared</span>{% endif %}
                    </a>
                    <form method="post" action="{% url 'alerts:saved_filter_delete' sf.id %}" class="pe-2" onsubmit="return confirm('Delete saved filter &quot;{{ sf.name }}&quot;?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-link text-danger p-0" title="Delete"><i class="bi bi-trash"></i></button>
                    </form>
                </li>
                {% empty %}
                <li><span class="dropdown-item-text text-secondary small">No saved filters yet</span></li>
                {% endfor %}
            </ul>
        </div>
        <button type="button" class="btn btn-sm btn-ariba-outline" data-bs-toggle="modal" data-bs-target="#saveFilterModal">
            <i class="bi bi-plus-lg"></i> Save current filter
        </button>
        <a class="btn btn-sm btn-ariba-outline" href="{% url 'alerts:export_csv' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}">
            <i class="bi bi-filetype-csv"></i> Export CSV
        </a>
    </div>
</div>

<div class="modal fade" id="saveFilterModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form method="post" action="{% url 'alerts:saved_filter_save' %}" class="modal-content">
            {% csrf_token %}
            <input type="hidden" name="query" id="saveFilterQuery" value="">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-bookmark-plus"></i> Save Current Filter</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Filter name</label>
                    <input type="text" name="name" class="form-control" maxlength="120" required>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_shared" value="1" id="saveFilterShared">
                    <label class="form-check-label" for="saveFilterShared">Share with all analysts</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ariba-outline" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-ariba-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    (function () {
        var modal = document.getElementById('saveFilterModal');
        if (modal) {
            modal.addEventListener('show.bs.modal', function () {
                var q = window.location.search.replace(/^\?/, '');
                document.getElementById('saveFilterQuery').value = q;
            });
        }
    })();
</script>
