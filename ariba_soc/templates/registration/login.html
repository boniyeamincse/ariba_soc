{% extends 'base.html' %}
{% load static %}

{% block auth_content %}
<style>
/* ==========================================================================
   Ariba SOC - High-Tech Animated Wave Login Experience
   ========================================================================== */
.login-universe {
    position: relative;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #0f1d38 0%, #080d1a 60%, #04070e 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
}

/* Cyber ambient grid */
.cyber-grid-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    pointer-events: none;
    z-index: 1;
}

/* Ambient glowing orbs */
.ambient-glow-orb {
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(37, 99, 235, 0.08) 50%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    filter: blur(50px);
    pointer-events: none;
    z-index: 1;
    animation: orbPulse 8s ease-in-out infinite alternate;
}

@keyframes orbPulse {
    0% { transform: translate(-50%, -60%) scale(0.9); opacity: 0.6; }
    100% { transform: translate(-50%, -60%) scale(1.2); opacity: 1; }
}

/* Glassmorphic Login Card */
.login-glass-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(6, 182, 212, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    animation: floatCard 6s ease-in-out infinite;
}

@keyframes floatCard {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
}

/* Shield Icon & Radar Wave Effect */
.shield-portal {
    position: relative;
    width: 76px;
    height: 76px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.shield-portal i {
    font-size: 2.8rem;
    background: linear-gradient(135deg, #38bdf8 0%, #06b6d4 50%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    z-index: 2;
    filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6));
}

.radar-wave, .radar-wave-2 {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 2px solid rgba(6, 182, 212, 0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: radarRipple 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
}

.radar-wave-2 {
    animation-delay: 1.5s;
}

@keyframes radarRipple {
    0% { width: 40px; height: 40px; opacity: 1; border-color: rgba(6, 182, 212, 0.8); }
    100% { width: 110px; height: 110px; opacity: 0; border-color: rgba(37, 99, 235, 0); }
}

/* Input Fields */
.login-input {
    background: rgba(13, 20, 36, 0.85) !important;
    border: 1px solid rgba(71, 85, 105, 0.6) !important;
    color: #e2e8f0 !important;
    border-radius: 10px !important;
    padding: 0.65rem 0.9rem !important;
    font-size: 0.9rem !important;
    transition: all 0.3s ease !important;
}

.login-input:focus {
    border-color: #06b6d4 !important;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.35), inset 0 0 5px rgba(6, 182, 212, 0.15) !important;
    background: rgba(15, 23, 42, 0.95) !important;
}

.login-input::placeholder {
    color: #475569 !important;
}

/* Glowing Wave Action Button */
.btn-wave-submit {
    position: relative;
    background: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #2563eb 100%);
    border: none;
    color: #ffffff;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-radius: 10px;
    padding: 0.7rem;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 4px 18px rgba(6, 182, 212, 0.35);
}

.btn-wave-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(6, 182, 212, 0.55);
    color: #ffffff;
}

.btn-wave-submit::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
    transform: rotate(30deg);
    animation: btnShimmer 4s infinite;
}

@keyframes btnShimmer {
    0% { transform: translate(-100%, -100%) rotate(30deg); }
    100% { transform: translate(100%, 100%) rotate(30deg); }
}

/* ==========================================================================
   SVG Ocean Wave Animations (Multi-Layer Hardware-Accelerated Waves)
   ========================================================================== */
.ocean-waves-container {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 180px;
    min-height: 120px;
    max-height: 220px;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
}

.waves-svg {
    position: relative;
    width: 100%;
    height: 100%;
    margin-bottom: -7px;
}

/* Animation on individual wave paths */
.parallax-wave > use {
    animation: waveDrift 25s cubic-bezier(.55, .5, .45, .5) infinite;
}

.parallax-wave > use:nth-child(1) {
    animation-delay: -2s;
    animation-duration: 9s;
}

.parallax-wave > use:nth-child(2) {
    animation-delay: -3s;
    animation-duration: 13s;
}

.parallax-wave > use:nth-child(3) {
    animation-delay: -4s;
    animation-duration: 18s;
}

.parallax-wave > use:nth-child(4) {
    animation-delay: -5s;
    animation-duration: 25s;
}

@keyframes waveDrift {
    0% { transform: translate3d(-90px, 0, 0); }
    100% { transform: translate3d(85px, 0, 0); }
}

@media (max-width: 768px) {
    .ocean-waves-container {
        height: 120px;
    }
}
</style>

<div class="login-universe">
    <!-- Cyber Grid Background -->
    <div class="cyber-grid-overlay"></div>
    
    <!-- Pulsing Ambient Orb Glow -->
    <div class="ambient-glow-orb"></div>

    <!-- Centered Glassmorphic Login Card -->
    <div class="card login-glass-card">
        <div class="card-body p-4 p-md-5">
            <!-- Animated Shield Logo -->
            <div class="text-center mb-3">
                <div class="shield-portal">
                    <div class="radar-wave"></div>
                    <div class="radar-wave-2"></div>
                    <i class="bi bi-shield-shaded"></i>
                </div>
                <h3 class="fw-bold mb-1" style="background: linear-gradient(135deg, #ffffff 0%, #93c5fd 60%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ARIBA SOC</h3>
                <p class="text-secondary small mb-0">Autonomous Defense &amp; Telemetry Cockpit</p>
            </div>

            <!-- Login Form -->
            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger py-2 px-3 small border-0 d-flex align-items-center mb-3" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-left: 3px solid #ef4444 !important; border-radius: 8px;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>Invalid username or password.</div>
                </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">
                        <i class="bi bi-person me-1 text-info"></i> Username or Email
                    </label>
                    <input type="text" name="username" class="form-control login-input" placeholder="e.g. yeamin or yeamin@akijgroup.co" required autofocus autocomplete="username">
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label text-secondary small fw-semibold mb-0">
                            <i class="bi bi-shield-lock me-1 text-info"></i> Password
                        </label>
                    </div>
                    <input type="password" name="password" class="form-control login-input" placeholder="Enter security passphrase" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-wave-submit w-100 py-2 d-flex align-items-center justify-content-center">
                    <span>Access SOC Cockpit</span>
                    <i class="bi bi-arrow-right-short fs-5 ms-1"></i>
                </button>
                <input type="hidden" name="next" value="{% url 'alerts:table' %}">
            </form>

            <div class="text-center mt-4">
                <small class="text-muted" style="font-size: 0.75rem;">
                    <i class="bi bi-lock-fill text-success me-1"></i> End-to-End Encrypted Telemetry &bull; v2.0
                </small>
            </div>
        </div>
    </div>

    <!-- Multi-Layer Moving Ocean Cyber Waves -->
    <div class="ocean-waves-container">
        <svg class="waves-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
             viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax-wave">
                <!-- Wave layer 1: Soft cyan wave -->
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(6, 182, 212, 0.18)" />
                <!-- Wave layer 2: Deep blue wave -->
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(37, 99, 235, 0.25)" />
                <!-- Wave layer 3: Navy oceanic wave -->
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(30, 58, 138, 0.45)" />
                <!-- Wave layer 4: Solid deep base wave -->
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(10, 14, 23, 0.95)" />
            </g>
        </svg>
    </div>
</div>
{% endblock %}
